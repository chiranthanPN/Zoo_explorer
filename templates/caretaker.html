<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Caretaker List</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef3f7;
            margin: 0;
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: #34495e;
            font-size: 34px;
            margin-bottom: 30px;
        }

        table {
            width: 85%;
            margin: auto;
            border-collapse: collapse;
            background: white;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.1);
            border-radius: 12px;
            overflow: hidden;
        }

        th {
            background: #8e44ad;
            color: white;
            padding: 12px;
            text-align: center;
            font-size: 18px;
        }

        td {
            padding: 12px;
            text-align: center;
            font-size: 16px;
            color: #333;
            border-bottom: 1px solid #ddd;
        }

        tr:hover {
            background-color: #f1f1f1;
        }

        .footer {
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
            color: #888;
        }

    </style>
</head>
<body>

    <h1>🧑‍🤝‍🧑 Caretaker Details</h1>

    <table>
        <tr>
            <th>Name</th>
            <th>Caretaker ID</th>
            <th>Experience (Years)</th>
            <th>Phone</th>
            <th>Age</th>
        </tr>

        {% for c in caretakers %}
        <tr>
            <td>{{ c.name }}</td>
            <td>{{ c.caretaker_id }}</td>
            <td>{{ c.exp }}</td>
            <td>{{ c.phone }}</td>
            <td>{{ c.age }}</td>
        </tr>
        {% endfor %}
    </table>

    <div class="footer">
        Zoo Management System © {{ year }}
    </div>

</body>
</html>
